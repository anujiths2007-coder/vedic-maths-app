<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VedaMath</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #182033;
    min-height: 100vh;
}

button {
    border: none;
    cursor: pointer;
    font-size: 15px;
}

.app {
    max-width: 1100px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 90px;
}

/* LOGIN */

.login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 25px;
}

.login-card {
    background: white;
    width: 100%;
    max-width: 430px;
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 15px 50px rgba(0,0,0,0.08);
}

.logo {
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 8px;
}

.logo span {
    color: #635bff;
}

.subtitle {
    color: #737b8c;
    margin-bottom: 30px;
}

input, select {
    width: 100%;
    padding: 14px;
    border: 1px solid #dfe3eb;
    border-radius: 12px;
    margin-top: 8px;
    margin-bottom: 18px;
    font-size: 15px;
}

label {
    font-weight: 600;
    font-size: 14px;
}

.primary {
    width: 100%;
    padding: 15px;
    background: #635bff;
    color: white;
    border-radius: 12px;
    font-weight: 700;
}

.primary:hover {
    opacity: 0.9;
}

/* HEADER */

.header {
    padding: 25px 25px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.header-logo {
    font-size: 27px;
    font-weight: 800;
}

.header-logo span {
    color: #635bff;
}

.streak {
    background: #fff1d8;
    padding: 10px 15px;
    border-radius: 20px;
    font-weight: 700;
}

/* PAGES */

.page {
    padding: 20px 25px;
}

.hidden {
    display: none !important;
}

.hero {
    background: linear-gradient(135deg, #635bff, #8c85ff);
    color: white;
    padding: 30px;
    border-radius: 25px;
    margin-bottom: 25px;
}

.hero h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.hero p {
    opacity: 0.9;
}

/* CARDS */

.section-title {
    margin: 25px 0 15px;
    font-size: 21px;
}

.topic-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
}

.topic-card {
    background: white;
    padding: 22px;
    border-radius: 18px;
    border: 1px solid #e8ebf2;
    transition: 0.2s;
}

.topic-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.07);
}

.topic-number {
    color: #635bff;
    font-weight: 800;
    margin-bottom: 12px;
}

.topic-card h3 {
    margin-bottom: 8px;
}

.topic-card p {
    color: #737b8c;
    font-size: 14px;
    line-height: 1.5;
}

.topic-card button {
    margin-top: 16px;
    background: #635bff;
    color: white;
    padding: 10px 15px;
    border-radius: 10px;
}

/* LESSON */

.lesson-card {
    background: white;
    padding: 30px;
    border-radius: 22px;
    line-height: 1.7;
}

.method-box {
    background: #f1f0ff;
    padding: 20px;
    border-radius: 15px;
    margin: 20px 0;
}

.example {
    background: #f7f8fa;
    padding: 18px;
    border-radius: 14px;
    margin-top: 15px;
}

.example strong {
    color: #635bff;
}

.back-btn {
    background: transparent;
    color: #635bff;
    font-weight: 700;
    margin-bottom: 18px;
}

/* PRACTICE */

.question-card {
    background: white;
    padding: 35px;
    border-radius: 22px;
    text-align: center;
}

.question {
    font-size: 38px;
    font-weight: 800;
    margin: 25px 0;
}

.answer-input {
    max-width: 300px;
    margin: auto;
    display: block;
    text-align: center;
    font-size: 20px;
}

.feedback {
    margin-top: 20px;
    padding: 18px;
    border-radius: 14px;
    background: #f1f0ff;
}

.feedback.correct {
    background: #e7f8ed;
}

.feedback.wrong {
    background: #fff0f0;
}

.next-btn {
    margin-top: 18px;
    padding: 13px 25px;
    background: #635bff;
    color: white;
    border-radius: 12px;
}

/* RESULTS */

.result-card {
    background: white;
    padding: 40px;
    border-radius: 25px;
    text-align: center;
}

.score {
    font-size: 65px;
    font-weight: 900;
    color: #635bff;
    margin: 20px;
}

/* PROFILE */

.profile-card {
    background: white;
    padding: 30px;
    border-radius: 22px;
}

.profile-avatar {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #635bff;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 800;
    margin-bottom: 15px;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-top: 25px;
}

.stat {
    background: #f7f8fa;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.stat h2 {
    color: #635bff;
}

/* CLASS CHANGE */

.class-box {
    margin-top: 25px;
    padding: 22px;
    background: #f7f8fa;
    border-radius: 17px;
}

.change-class-btn {
    margin-top: 12px;
    padding: 12px 18px;
    background: #635bff;
    color: white;
    border-radius: 10px;
}

.confirm-box {
    margin-top: 15px;
    padding: 18px;
    background: #eeeefe;
    border-radius: 14px;
}

.confirm-box button {
    padding: 10px 15px;
    border-radius: 9px;
    margin-right: 8px;
}

.confirm-yes {
    background: #635bff;
    color: white;
}

.confirm-no {
    background: #ddd;
}

/* NAV */

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: min(1100px, 100%);
    background: white;
    border-top: 1px solid #e5e7ec;
    display: flex;
    justify-content: space-around;
    padding: 12px 10px;
    z-index: 100;
}

.nav-btn {
    background: transparent;
    color: #8b92a1;
    padding: 8px 20px;
    font-weight: 700;
}

.nav-btn.active {
    color: #635bff;
}

/* MOBILE */

@media(max-width:600px) {

    .header {
        padding: 20px;
    }

    .page {
        padding: 15px 20px;
    }

    .hero h1 {
        font-size: 24px;
    }

    .stat-grid {
        grid-template-columns: 1fr;
    }

    .question {
        font-size: 30px;
    }

    .login-card {
        padding: 28px;
    }
}
</style>
</head>

<!-- LOGIN -->

<div id="loginScreen" class="login-screen">

    <div class="login-card">

            <option value="7">Class 7</option>
            <option value="8">Class 8</option>
            <option value="9">Class 9</option>
            <option value="10">Class 10</option>
        </select>

        <button class="primary" onclick="login()">
            Start Learning
        </button>

    </div>

</div>


<!-- MAIN APP -->

<div id="app" class="app hidden">

    <div class="header">

        <div class="header-logo">
            Veda<span>Math</span>
        </div>

        <div class="streak">
            🔥 <span id="streakText">0</span> day
        </div>

    </div>


    <!-- HOME -->

    <section id="homePage" class="page">

        <div class="hero">

            <h1 id="welcomeText">
                Welcome!
            </h1>

            <p id="classText">
                Let's start learning.
            </p>

        </div>

        <h2 class="section-title">
            Your Learning Path
        </h2>

        <div id="topicGrid" class="topic-grid"></div>

    </section>


    <!-- LESSON -->

    <section id="lessonPage" class="page hidden">

        <button class="back-btn" onclick="showHome()">
            ← Back to Topics
        </button>

        <div id="lessonContent"></div>

    </section>


    <!-- PRACTICE -->

    <section id="practicePage" class="page hidden">

        <button class="back-btn" onclick="showHome()">
            ← Exit Practice
        </button>

        <div id="practiceContent"></div>

    </section>


    <!-- RESULTS -->

    <section id="resultsPage" class="page hidden">

        <div class="result-card">

            <h1>Practice Complete 🎉</h1>

            <div id="resultScore" class="score">
                0/5
            </div>

            <p id="resultMessage"></p>

            <br>

            <button class="primary" onclick="showHome()">
                Continue Learning
            </button>

        </div>

    </section>


    <!-- PROFILE -->

    <section id="profilePage" class="page hidden">

        <div class="profile-card">

            <div id="profileAvatar" class="profile-avatar">
                A
            </div>

            <h2 id="profileName">
                Student
            </h2>

            <p id="profileClass">
                Class 1
            </p>


            <div class="class-box">

                <h3>🎓 Current Class</h3>

                <p style="margin-top:8px;color:#737b8c;">
                    Your learning path is currently set to:
                </p>

                <select id="changeClassSelect"></select>

                <button
                    class="change-class-btn"
                    onclick="askChangeClass()">
                    Change Class
                </button>

                <div id="confirmBox" class="confirm-box hidden">

                    <p id="confirmText"></p>

                    <br>

                    <button
                        class="confirm-yes"
                        onclick="confirmChangeClass()">
                        Yes, Change Class
                    </button>

                    <button
                        class="confirm-no"
                        onclick="cancelChangeClass()">
                        Cancel
                    </button>

                </div>

            </div>


            <div class="stat-grid">

                <div class="stat">
                    <h2 id="topicsCompleted">0</h2>
                    <p>Topics Done</p>
                </div>

                <div class="stat">
                    <h2 id="questionsSolved">0</h2>
                    <p>Questions</p>
                </div>

                <div class="stat">
                    <h2 id="bestScore">0%</h2>
                    <p>Best Score</p>
                </div>

            </div>

        </div>

    </section>


    <!-- NAV -->

    <nav class="bottom-nav">

        <button
            id="homeNav"
            class="nav-btn active"
            onclick="showHome()">
            🏠 Home
        </button>

        <button
            id="profileNav"
            class="nav-btn"
            onclick="showProfile()">
            👤 Profile
        </button>

    </nav>

</div>

    {q:"4 × 3", a:12, e:"4 groups of 3 = 12."},
    {q:"5 × 4", a:20, e:"5 groups of 4 = 20."},
    {q:"6 × 3", a:18, e:"6 groups of 3 = 18."},
    {q:"7 × 2", a:14, e:"7 groups of 2 = 14."},
    {q:"8 × 5", a:40, e:"8 groups of 5 = 40."}
],

"Double & Half": [
    {q:"Double 25", a:50, e:"25 + 25 = 50."},
    {q:"Double 18", a:36, e:"18 + 18 = 36."},
    {q:"Half of 20", a:10, e:"20 ÷ 2 = 10."},
    {q:"Half of 36", a:18, e:"36 ÷ 2 = 18."},
    {q:"Double 45", a:90, e:"45 + 45 = 90."}
]

};


/* =====================================================
   STORAGE
===================================================== */

function loadData() {

    const savedUser = localStorage.getItem("vedamathUser");
    const savedProgress = localStorage.getItem("vedamathProgress");

    if(savedUser) {
        user = JSON.parse(savedUser);
    }

    if(savedProgress) {
        progress = JSON.parse(savedProgress);
    }

}


function saveData() {

    localStorage.setItem(
        "vedamathUser",
        JSON.stringify(user)
    );

    localStorage.setItem(
        "vedamathProgress",
        JSON.stringify(progress)
    );

}


/* =====================================================
   LOGIN
===================================================== */

function login() {

    const name = document.getElementById("nameInput").value.trim();

    if(!name) {
        alert("Please enter your name.");
        return;
    }

    user.name = name;

    user.currentClass =
        Number(document.getElementById("classInput").value);

    saveData();

    document
        .getElementById("loginScreen")
        .classList.add("hidden");

    document
        .getElementById("app")
        .classList.remove("hidden");

    updateAll();

    showHome();

}


/* =====================================================
   INITIALIZATION
===================================================== */

function initialize() {

    loadData();

    if(user.name) {

        document
            .getElementById("loginScreen")
            .classList.add("hidden");

        document
            .getElementById("app")
            .classList.remove("hidden");

        updateAll();

    }

}


/* =====================================================
   HOME
===================================================== */

function renderHome() {

    document.getElementById("welcomeText").innerText =
        "Welcome back, " + user.name + " 👋";

    document.getElementById("classText").innerText =
        "You're learning at Class " + user.currentClass + " level.";

    const grid =
        document.getElementById("topicGrid");

    grid.innerHTML = "";

    const topics = curriculum[user.currentClass];

    topics.forEach((topic, index) => {

        const card = document.createElement("div");

        card.className = "topic-card";

        card.innerHTML = `

            <div class="topic-number">
                TOPIC ${index + 1}
            </div>

            <h3>${topic[0]}</h3>

            <p>${topic[1]}</p>

            <button onclick="openLesson(${index})">
                Learn →
            </button>

        `;

        grid.appendChild(card);

    });

}


/* =====================================================
   LESSON
===================================================== */

function openLesson(index) {

    selectedTopic =
        curriculum[user.currentClass][index];

    const title = selectedTopic[0];
    const description = selectedTopic[1];
    const example = selectedTopic[2];

    const lessonContent =
        document.getElementById("lessonContent");

    lessonContent.innerHTML = `

        <div class="lesson-card">

            <h1>${title}</h1>

            <br>

            <p>
                ${description}
            </p>

            <div class="method-box">

                <h3>🧠 Method</h3>

                <p>
                    Understand the numbers first.
                    Break the calculation into smaller,
                    easier parts and solve it mentally.
                </p>

            </div>

            <div class="example">

                <strong>Example</strong>

                <p>${example}</p>

            </div>

            <div class="example">

                <strong>Why it works</strong>

                <p>
                    The method reduces a larger calculation
                    into smaller calculations that are easier
                    to handle mentally.
                </p>

            </div>

            <br>

            <button
                class="primary"
                onclick="startPractice()">

                Practice This Topic

            </button>

        </div>
    `;

    hidePages();

    document
        .getElementById("lessonPage")
        .classList.remove("hidden");

}


/* =====================================================
   PRACTICE
===================================================== */

function startPractice() {

    const title = selectedTopic[0];

    currentQuestions =
        practiceBank[title] || createGenericQuestions(title);

    practiceIndex = 0;
    practiceScore = 0;

    renderQuestion();

    hidePages();

    document
        .getElementById("practicePage")
        .classList.remove("hidden");

}


function createGenericQuestions(title) {

    return [

        {
            q: "12 + 8",
            a: 20,
            e: "12 + 8 = 20."
        },

        {
            q: "25 + 15",
            a: 40,
            e: "25 + 15 = 40."
        },

        {
            q: "30 - 12",
            a: 18,
            e: "30 - 12 = 18."
        },

        {
            q: "6 × 7",
            a: 42,
            e: "6 × 7 = 42."
        },

        {
            q: "100 ÷ 4",
            a: 25,
            e: "100 ÷ 4 = 25."
        }

    ];

}


function renderQuestion() {

    const q = currentQuestions[practiceIndex];

    const container =
        document.getElementById("practiceContent");

    container.innerHTML = `

        <div class="question-card">

            <p>
                Question ${practiceIndex + 1}
                of ${currentQuestions.length}
            </p>

            <div class="question">
                ${q.q}
            </div>

            <input
                id="answerInput"
                class="answer-input"
                type="number"
                placeholder="Your answer"
                onkeydown="if(event.key==='Enter') checkAnswer()"
            >

            <button
                class="next-btn"
                onclick="checkAnswer()">

                Check Answer

            </button>

            <div id="feedback"></div>

        </div>
    `;

    setTimeout(() => {

        document
            .getElementById("answerInput")
            ?.focus();

    }, 100);

}


function checkAnswer() {

    const input =
        document.getElementById("answerInput");

    const answer =
        Number(input.value);

    const q =
        currentQuestions[practiceIndex];

    const feedback =
        document.getElementById("feedback");

    if(input.value === "") {

        alert("Enter an answer first.");

        return;

    }


    if(answer === q.a) {

        practiceScore++;

        feedback.innerHTML = `

            <div class="feedback correct">

                <strong>✅ Correct!</strong>

                <p>
                    Great work. Keep going!
                </p>

                <button
                    class="next-btn"
                    onclick="nextQuestion()">

                    Next Question →

                </button>

            </div>

        `;

    } else {

        feedback.innerHTML = `

            <div class="feedback wrong">

                <strong>❌ Not quite.</strong>

                <p>
                    Correct answer:
                    <b>${q.a}</b>
                </p>

                <br>

                <p>
                    ${q.e}
                </p>

                <button
                    class="next-btn"
                    onclick="nextQuestion()">

                    Next Question →

                </button>

            </div>

        `;

    }

}


function nextQuestion() {

    practiceIndex++;

    if(practiceIndex >= currentQuestions.length) {

        finishPractice();

    } else {

        renderQuestion();

    }

}


/* =====================================================
   RESULTS
===================================================== */

function finishPractice() {

    const total =
        currentQuestions.length;

    const percentage =
        Math.round((practiceScore / total) * 100);

    saveTopicProgress(percentage);

    document.getElementById("resultScore").innerText =
        practiceScore + "/" + total;

    let message = "";

    if(percentage === 100) {

        message = "🔥 Perfect score! You're flying!";

    } else if(percentage >= 80) {

        message = "💪 Excellent work! Keep building speed.";

    } else if(percentage >= 60) {

        message = "👍 Good job! A little more practice will help.";

    } else {

        message = "🧠 Keep practicing. You'll get faster.";

    }

    document
        .getElementById("resultMessage")
        .innerText = message;

    hidePages();

    document
        .getElementById("resultsPage")
        .classList.remove("hidden");

}


function saveTopicProgress(score) {

    const classKey =
        "class" + user.currentClass;

    if(!progress[classKey]) {

        progress[classKey] = {};

    }

    const topicName =
        selectedTopic[0];

    if(!progress[classKey][topicName]) {

        progress[classKey][topicName] = {

            completed: false,
            attempts: 0,
            bestScore: 0,
            questions: 0

        };

    }

    const data =
        progress[classKey][topicName];

    data.attempts++;

    data.questions += currentQuestions.length;

    data.bestScore =
        Math.max(data.bestScore, score);

    if(score >= 80) {

        data.completed = true;

    }

    saveData();

}


/* =====================================================
   PROFILE
===================================================== */

function renderProfile() {

    document.getElementById("profileName").innerText =
        user.name;

    document.getElementById("profileClass").innerText =
        "Class " + user.currentClass;

    document.getElementById("profileAvatar").innerText =
        user.name.charAt(0).toUpperCase();


    const select =
        document.getElementById("changeClassSelect");

    select.innerHTML = "";

    for(let i = 1; i <= 10; i++) {

        const option =
            document.createElement("option");

        option.value = i;

        option.innerText =
            "Class " + i;

        if(i === user.currentClass) {

            option.selected = true;

        }

        select.appendChild(option);

    }


    calculateStats();

}


function calculateStats() {

    const classKey =
        "class" + user.currentClass;

    const classProgress =
        progress[classKey] || {};

    let completed = 0;
    let questions = 0;
    let best = 0;

    Object.values(classProgress).forEach(topic => {

        if(topic.completed) {

            completed++;

        }

        questions += topic.questions || 0;

        best =
            Math.max(best, topic.bestScore || 0);

    });

    document.getElementById("topicsCompleted").innerText =
        completed;

    document.getElementById("questionsSolved").innerText =
        questions;

    document.getElementById("bestScore").innerText =
        best + "%";

}


/* =====================================================
   CLASS CHANGE
===================================================== */

function askChangeClass() {

    const select =
        document.getElementById("changeClassSelect");

    const newClass =
        Number(select.value);

    if(newClass === user.currentClass) {

        alert("You're already in Class " + newClass + ".");

        return;

    }

    pendingClass = newClass;

    document.getElementById("confirmText").innerText =
        "Move from Class " +
        user.currentClass +
        " to Class " +
        newClass +
        "? Your current progress will be saved.";

    document
        .getElementById("confirmBox")
        .classList.remove("hidden");

}


function confirmChangeClass() {

    if(!pendingClass) return;

    user.currentClass =
        pendingClass;

    pendingClass = null;

    saveData();

    document
        .getElementById("confirmBox")
        .classList.add("hidden");

    updateAll();

    showProfile();

    alert(
        "Class changed successfully! 🎓\n\n" +
        "Welcome to Class " +
        user.currentClass +
        "!"
    );

}


function cancelChangeClass() {

    pendingClass = null;

    document
        .getElementById("confirmBox")
        .classList.add("hidden");

    document.getElementById("changeClassSelect").value =
        user.currentClass;

}


/* =====================================================
   NAVIGATION
===================================================== */

function hidePages() {

    document
        .getElementById("homePage")
        .classList.add("hidden");

    document
        .getElementById("lessonPage")
        .classList.add("hidden");

    document
        .getElementById("practicePage")
        .classList.add("hidden");

    document
        .getElementById("resultsPage")
        .classList.add("hidden");

    document
        .getElementById("profilePage")
        .classList.add("hidden");

}


function showHome() {

    hidePages();

    document
        .getElementById("homePage")
        .classList.remove("hidden");

    setActiveNav("homeNav");

    renderHome();

}


function showProfile() {

    hidePages();

    document
        .getElementById("profilePage")
        .classList.remove("hidden");

    setActiveNav("profileNav");

    renderProfile();

}


function setActiveNav(id) {

    document
        .querySelectorAll(".nav-btn")
        .forEach(btn => {

            btn.classList.remove("active");

        });

    document
        .getElementById(id)
        .classList.add("active");

}


/* =====================================================
   UPDATE
===================================================== */

function updateAll() {

    renderHome();
    renderProfile();

    document.getElementById("streakText").innerText =
        calculateStreak();

}


function calculateStreak() {

    let streak =
        Number(localStorage.getItem("vedamathStreak") || 0);

    const today =
        new Date().toDateString();

    const lastDay =
        localStorage.getItem("vedamathLastDay");

    if(lastDay !== today) {

        if(lastDay) {

            const last =
                new Date(lastDay);

            const now =
                new Date();

            const difference =
                Math.floor(
                    (now - last) /
                    (1000 * 60 * 60 * 24)
                );

            if(difference === 1) {

                streak++;

            } else {

                streak = 1;

            }

        } else {

            streak = 1;

        }

        localStorage.setItem(
            "vedamathStreak",
            streak
        );

        localStorage.setItem(
            "vedamathLastDay",
            today
        );

    }

    return streak;

}


/* =====================================================
   START
===================================================== */

initialize();

</script>
